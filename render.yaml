# Configuration Render (Blueprint) : New + → Blueprint → choisir ce dépôt
services:
  - type: web
    name: alhassane-diane-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: TRUST_PROXY
        value: "1"
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # Brevo : Render gratuit bloque le port 587, Brevo accepte aussi le 2525
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: alhassanediane62496@gmail.com
      - key: MAIL_TO
        value: alhassanediane62496@gmail.com
